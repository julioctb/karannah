<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyería SaaS — Sistema de Gestión</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('assets/runtime/inter-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
      src: url('assets/runtime/jetbrains-mono-latin.woff2') format('woff2');
    }

    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(48% 0.12 270);
      --accent-light: oklch(95% 0.03 270);
      --success: oklch(55% 0.16 145);
      --success-bg: oklch(95% 0.04 145);
      --warning: oklch(70% 0.15 85);
      --warning-bg: oklch(95% 0.04 85);
      --danger: oklch(55% 0.2 25);
      --danger-bg: oklch(95% 0.04 25);
      --gold: oklch(75% 0.12 85);
      --gold-bg: oklch(96% 0.03 85);

      --font-display: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --sidebar-width: 240px;
      --header-height: 56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }

    .mono { font-family: var(--font-mono); font-size: 12px; }
    .tabular { font-variant-numeric: tabular-nums; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .pill-success { background: var(--success-bg); color: var(--success); }
    .pill-warning { background: var(--warning-bg); color: oklch(55% 0.12 85); }
    .pill-danger { background: var(--danger-bg); color: var(--danger); }
    .pill-gold { background: var(--gold-bg); color: oklch(55% 0.1 85); }
    .pill-muted { background: var(--border); color: var(--muted); }
    .pill-accent { background: var(--accent-light); color: var(--accent); }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      transition-property: background-color, border-color, box-shadow, color, filter, scale;
      transition-duration: 0.15s;
      transition-timing-function: ease-out;
    }

    button:active:not(:disabled) { scale: 0.96; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label[tabindex="0"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    .btn-secondary {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
    }
    .btn-ghost:hover { background: var(--border); color: var(--fg); }

    input, select {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: var(--bg);
    }
    tr:hover td { background: oklch(99% 0.002 250); }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .capture-modal {
      width: min(860px, calc(100vw - 32px));
      max-height: 90vh;
      overflow: auto;
      padding: 0;
    }
    .client-form-modal {
      width: min(620px, calc(100vw - 32px));
      max-height: 90vh;
      overflow: auto;
      padding: 0;
    }
    .client-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .client-form-field { display: grid; gap: 6px; min-width: 0; }
    .client-form-field-full { grid-column: 1 / -1; }
    .client-form-label { color: var(--muted); font-size: 12px; font-weight: 500; }
    .client-form-field input { width: 100%; min-width: 0; min-height: 44px; }
    .client-type-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .client-type-group button { min-height: 44px; }
    .client-type-button[aria-pressed="true"] { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .client-form-error { min-height: 16px; color: var(--danger); font-size: 11px; }
    .client-credit-note { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .client-policy-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .client-admin-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .client-commercial-section { display: grid; gap: 8px; }
    .client-commercial-note { color: var(--muted); font-size: 11px; line-height: 1.45; text-wrap: pretty; }
    .client-admin-action { min-height: 44px; white-space: nowrap; }
    .sales-filter-bar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sales-date-range { display: flex; align-items: end; gap: 8px; }
    .sales-date-field { display: grid; gap: 6px; min-width: 172px; }
    .sales-date-label { color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .sales-date-input {
      min-height: 44px;
      width: 100%;
      color: var(--fg);
      background: var(--surface);
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .sales-date-input:hover { border-color: var(--muted); }
    .sales-date-input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.72; }
    .sales-summary-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(2, minmax(140px, 0.8fr));
      border-bottom: 1px solid var(--border);
    }
    .sales-summary-item { padding: 18px 20px; border-right: 1px solid var(--border); }
    .sales-summary-item:last-child { border-right: 0; }
    .sales-summary-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .sales-summary-value { margin-top: 4px; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .sales-table-wrap { overflow-x: auto; }
    .sales-table-wrap table { min-width: 1060px; }
    .sales-row { cursor: pointer; }
    .sales-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .sale-detail-modal {
      width: min(780px, calc(100vw - 32px));
      max-height: 90vh;
      overflow: auto;
      padding: 0;
    }
    .sale-detail-client {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .sale-detail-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .sale-detail-meta-item { min-width: 0; padding: 12px; border-right: 1px solid var(--border); }
    .sale-detail-meta-item:last-child { border-right: 0; }
    .sale-detail-meta-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .sale-detail-meta-value { margin-top: 4px; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
    .sale-detail-items { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    .sale-detail-items table { min-width: 650px; }
    .sale-detail-total {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .pos-client-selector {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }
    .pos-client-selector select { width: 100%; min-width: 0; min-height: 44px; }
    .pos-client-add { min-height: 44px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .variation-option {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 14px;
      text-align: left;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .variation-option:hover { background: var(--bg); border-color: var(--accent); }
    .variation-option[aria-checked="true"] { background: var(--accent-light); border-color: var(--accent); }
    .variation-option-copy { display: grid; gap: 2px; }
    .variation-option-copy span { color: var(--muted); font-size: 11px; font-weight: 400; text-wrap: pretty; }
    .variation-switch {
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
      padding: 3px;
      border-radius: 999px;
      background: var(--border);
      transition-property: background-color;
      transition-duration: 160ms;
      transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    }
    .variation-switch::after {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 3px oklch(22% 0.02 240 / 0.22);
      transform: translateX(0);
      transition-property: transform;
      transition-duration: 160ms;
      transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    }
    .variation-option[aria-checked="true"] .variation-switch { background: var(--accent); }
    .variation-option[aria-checked="true"] .variation-switch::after { transform: translateX(18px); }
    .variation-panel {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .variation-type-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .variation-type-button { min-height: 44px; padding: 8px 12px; }
    .variation-type-button[aria-pressed="true"] { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .variation-row {
      display: grid;
      grid-template-columns: 112px minmax(140px, 1.25fr) 90px minmax(112px, 1fr) minmax(112px, 1fr) 44px;
      gap: 8px;
      align-items: end;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .variation-row:last-child { border-bottom: 0; }
    .variation-field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .variation-field input { width: 100%; min-width: 0; min-height: 44px; }
    .variation-sku { min-height: 36px; display: flex; align-items: center; color: var(--fg); overflow-wrap: anywhere; }
    .variation-remove { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; color: var(--danger); }
    .variation-summary {
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .variation-summary-row {
      display: grid;
      grid-template-columns: 1.2fr 1.4fr repeat(3, 0.8fr);
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      font-size: 12px;
    }
    .variation-summary-row:last-child { border-bottom: 0; }
    .variation-summary-row.header { color: var(--muted); background: var(--bg); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: oklch(18% 0.02 250 / 0.56);
    }
    .modal-header {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 17px; font-weight: 600; }
    .modal-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .modal-close { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; }
    .modal-footer {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
    }
    .modal-footer button { min-height: 44px; }

    .pos-client-picker {
      min-width: 0;
      min-height: 52px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 12px;
      align-items: center;
      padding: 7px 12px;
      text-align: left;
    }
    .pos-client-picker-label { color: var(--muted); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .pos-client-picker-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-size: 13px; }
    .pos-client-picker-caret { grid-column: 2; grid-row: 1 / 3; color: var(--muted); font-size: 17px; }
    .credit-summary-trigger { width: calc(100% - 32px); min-height: 44px; margin: 8px 16px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .client-selector-modal { width: min(600px, calc(100vw - 32px)); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .client-selector-search { position: relative; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .client-selector-search .icon { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .client-selector-search input { width: 100%; min-height: 44px; padding-left: 40px; }
    .client-selector-list { min-height: 160px; max-height: min(520px, 58vh); overflow-y: auto; padding: 8px; }
    .client-selector-option {
      width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 10px 12px; background: transparent; color: var(--fg); border: 1px solid transparent; text-align: left;
    }
    .client-selector-option:hover { background: var(--bg); border-color: var(--border); }
    .client-selector-option[aria-selected="true"] { background: var(--accent-light); border-color: var(--accent); }
    .client-option-main { min-width: 0; display: grid; gap: 2px; }
    .client-option-main small { color: var(--muted); font-size: 11px; }
    .client-option-title { display: flex; align-items: center; gap: 8px; }
    .client-option-check { flex: 0 0 auto; color: var(--accent); font-size: 18px; font-weight: 700; }
    .client-selector-empty { padding: 32px 16px; color: var(--muted); text-align: center; }

    .credit-summary-modal { width: min(820px, calc(100vw - 32px)); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .credit-modal-body { display: grid; gap: 20px; padding: 24px; overflow-y: auto; }
    .credit-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .credit-summary-item { display: grid; gap: 4px; padding: 16px; border-right: 1px solid var(--border); }
    .credit-summary-item:last-child { border-right: 0; }
    .credit-summary-item span { color: var(--muted); font-size: 11px; }
    .credit-summary-item strong { font-size: 19px; font-variant-numeric: tabular-nums; }
    .credit-summary-current { background: var(--accent-light); }
    .credit-summary-current strong { color: var(--accent); }
    .credit-movements-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .credit-movements-heading h3 { font-size: 14px; font-weight: 600; }
    .credit-movements-heading p, .credit-data-note { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .credit-movement-table { border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    .credit-movement-table table { min-width: 620px; }
    .credit-movement-empty { padding: 36px; color: var(--muted); text-align: center; }

    .repair-form-modal, .repair-detail-modal { width: min(680px, calc(100vw - 32px)); max-height: 90vh; overflow-y: auto; }
    .repair-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
    .repair-field { min-width: 0; display: grid; align-content: start; gap: 6px; }
    .repair-field-full { grid-column: 1 / -1; }
    .repair-field label { color: var(--muted); font-size: 12px; font-weight: 500; }
    .repair-field input, .repair-field select { width: 100%; min-width: 0; min-height: 44px; }
    .repair-field-help { min-height: 15px; color: var(--muted); font-size: 10px; }
    .repair-form-error { min-height: 16px; color: var(--danger); font-size: 11px; }
    .repair-client-field { position: relative; }
    .repair-client-search-control { position: relative; }
    .repair-client-search-control .icon { position: absolute; z-index: 1; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .repair-client-search-control input { padding-left: 40px; }
    .repair-client-results { position: absolute; z-index: 12; top: 72px; left: 0; right: 0; max-height: 240px; overflow-y: auto; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .repair-client-option { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; color: var(--fg); background: transparent; text-align: left; }
    .repair-client-option:hover { color: var(--fg); background: var(--bg); }
    .repair-client-option > span:first-child { min-width: 0; display: grid; gap: 2px; }
    .repair-client-option small { color: var(--muted); font-size: 10px; }
    .repair-client-empty { padding: 24px 12px; color: var(--muted); text-align: center; }
    .repair-client-confirmed { color: var(--success); font-size: 11px; font-weight: 500; }
    .repair-money-control { position: relative; }
    .repair-money-control > span { position: absolute; z-index: 1; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .repair-money-control input { padding-left: 28px; }

    .repair-date-picker { position: relative; }
    .repair-date-trigger { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
    .repair-date-trigger[aria-expanded="true"] { color: var(--accent); background: var(--accent-light); border-color: var(--accent); }
    .repair-calendar-glyph { font-size: 18px; line-height: 1; }
    .repair-calendar { position: absolute; z-index: 14; top: calc(100% + 6px); left: 0; width: 320px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .repair-calendar-header { min-height: 44px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; text-transform: capitalize; }
    .repair-calendar-header button { width: 44px; height: 44px; padding: 0; font-size: 22px; }
    .repair-calendar-weekdays, .repair-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .repair-calendar-weekdays span { padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 600; text-align: center; }
    .repair-calendar-day { min-width: 36px; min-height: 36px; padding: 0; color: var(--fg); background: transparent; }
    .repair-calendar-day:hover:not(:disabled) { color: var(--fg); background: var(--bg); }
    .repair-calendar-day[aria-pressed="true"] { color: white; background: var(--accent); }

    .repair-attention { margin-bottom: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .repair-attention-header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .repair-attention-header h2, .repair-list-toolbar h2 { font-size: 15px; font-weight: 600; }
    .repair-attention-header p, .repair-list-toolbar p { margin-top: 3px; color: var(--muted); font-size: 11px; }
